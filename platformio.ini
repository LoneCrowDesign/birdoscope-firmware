; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = src
; Board envs only, so a bare `pio run` means "build the firmware". env:native
; builds tests and has no firmware sources, which PlatformIO reports as a build
; error rather than a no-op; run it with `pio test -e native`.
default_envs =
    heltec_v4
    heltec_v3
    xiao_esp32s3
    esp32-s3-devkitc1-n16r8
    esp32-s3-devkitc1-n8r2
    analyze_r01_n8r2
    analyze_r01_n16r8
    esp32round

; ── Shared bases (via `extends`) ────────────────────────────────────────────
; Concrete [env:*] sections below extend one of these and declare only their
; deltas (board, board-specific -I/-D flags, memory/partition table). Add new
; boards by extending [oled], or [common] for a different display family.
; Don't re-paste the platform/lib_deps/lib_extra_dirs blocks.
;
; Exception to deltas-only: every [env:*] must name its own
; board_build.partitions. A table inherited from another board's flash size
; produces an unbootable image.

; Everything common to every board.
[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = spiffs
; Stamps the git rev, commit date and build time into the binary, so a device
; in the field reports which commit it is running. See tools/git_version.py.
extra_scripts =
    pre:tools/check_submodules.py
    pre:tools/git_version.py
; WebConsole and roost, from the vendor/jellybeans submodule. See [web].
lib_extra_dirs = vendor/jellybeans
build_flags =
    -I include
    -DCORE_DEBUG_LEVEL=0

; Radio/GPS/JSON stack used by every board (WebConsole portal + serial JSON).
;
; Two libraries come from the jellybeans repo, referenced as a submodule under
; vendor/: the WebConsole portal (esp_webserver) and roost, the fleet logging
; contract whose generated header hard-errors if a board omits a capability or
; component declaration.
;
; A submodule records a commit rather than copying source, so WebConsole stays a
; separate GPLv3 project and is not redistributed in this MIT-licensed tree. See
; NOTICE.
;
; They arrive via lib_extra_dirs rather than a lib_deps git URL because a git
; URL resolves to exactly one library manifest per repository, so a repo holding
; more than one library silently yields whichever it picks. lib_extra_dirs scans
; for every manifest below the directory instead. Clone with --recursive, or run
; `git submodule update --init`.
;
; lib_extra_dirs lives in [common] rather than here, because [oled] pulls
; ${web.lib_deps} by interpolation and would not inherit it from this section.
[web]
lib_deps =
    mikalhart/TinyGPSPlus@^1.0.3
    bblanchon/ArduinoJson@^7.2.0
    ESP32Async/ESPAsyncWebServer@^3.11.2
    ESP32Async/AsyncTCP@^3.4.10

; u8g2 status-line OLED family (Heltec V4/V3, XIAO, S3 DevKitC, Analyze r0.1).
; Shares src/main_oled.cpp; adds the NeoPixel + U8g2 libs on top of [web].
[oled]
extends = common
build_src_filter = +<main_oled.cpp>
lib_deps =
    ${web.lib_deps}
    adafruit/Adafruit NeoPixel@^1.12.3
    olikraus/U8g2@^2.35.30


; ── Host tests ──────────────────────────────────────────────────────────────
; Runs on the build machine, not a board. Compiles the analyze board's
; capability and component declarations against the generated roost header and
; asserts what no on-device check can: that a row's field count matches the
; header its manifest declares. core.cpp is not built; only board_config.h and
; the registry header are free of Arduino types.
[env:native]
platform = native
test_framework = unity
lib_extra_dirs = vendor/jellybeans
extra_scripts = pre:tools/check_submodules.py
; Empty filter keeps a bare `pio run` from compiling main_oled.cpp for the host.
build_src_filter = -<*>
build_flags =
    -I include
    -I include/boards/analyze_r01_esp32s3


; ── Heltec WiFi LoRa 32 V4 ──────────────────────────────────────────────────
; V4: ESP32-S3R2 core, 16MB flash, 2MB PSRAM, SSD1306 OLED, SMA antenna, LiPo
; charging. The platform publishes no V4 board definition, so this uses the V3
; one and overrides what differs: the V3 is an 8MB part, the V4 a 16MB part.
; maximum_size must move with flash_size, otherwise the upload size check still
; caps the image at the V3's 8MB.
[env:heltec_v4]
extends = oled
board = heltec_wifi_lora_32_V3
build_flags =
    ${common.build_flags}
    -I include/boards/heltecv4
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_16mb.csv


; ── Heltec WiFi LoRa 32 V3 ──────────────────────────────────────────────────
; V3 has its own pinout and feature set, so it gets its own board config rather
; than sharing the V4's. Same platform board def as heltec_v4, but an 8MB part
; rather than a 16MB one, so it takes the 8MB partition table.
; STUB: the board config is a placeholder and blocks the build with an #error
; until its pins are verified. Define HELTECV3_UNVERIFIED_OK to build anyway.
; Pinout and PSRAM presence still need verification.
[env:heltec_v3]
extends = oled
board = heltec_wifi_lora_32_V3
build_flags =
    ${common.build_flags}
    -I include/boards/heltecv3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = partitions_8mb.csv


; ── Seeed XIAO ESP32-S3 ─────────────────────────────────────────────────────
; S3 core, 8MB flash, 8MB PSRAM, no onboard display, USB-C native.
; STUB: pinout for LED/buzzer/GPS/SD differs from DevKitC-1; needs mapping.
[env:xiao_esp32s3]
extends = oled
board = seeed_xiao_esp32s3
build_flags =
    ${common.build_flags}
    -I include/boards/xiao_esp32s3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions_8mb.csv


; ── ESP32-S3-DevKitC-1-N16R8 ───────────────────────────────────
; 16MB flash, 8MB PSRAM (QIO OPI) — both come from the board
; def. No onboard display/GPS/SD/LED — SD, external NeoPixel, GPS, two buttons,
; and an I2C OLED are all wired up on the breadboard. Uses src/main_oled.cpp —
; see include/boards/esp32s3_devkitc1/board_config.h for this board's pins. None of
; the pin assignments are wiring-confirmed yet.
;
; No -DARDUINO_USB_CDC_ON_BOOT here — per docs/hardware/hardware_s3n16r8.md,
; Serial goes through the CH343P hardware UART bridge (USB1), not native
; USB-CDC (USB2/OTG, GPIO19/20). Setting the flag would init the wrong port.
[env:esp32-s3-devkitc1-n16r8]
extends = oled
board = esp32-s3-devkitc1-n16r8
build_flags =
    ${common.build_flags}
    -I include/boards/esp32s3_devkitc1
    -DBOARD_HAS_PSRAM
;   -DARDUINO_USB_CDC_ON_BOOT=1
board_build.partitions = partitions_16mb.csv


; ── ESP32-S3-DevKitC-1-N8R2 ───────────────────────────────────
; Same DevKitC-1 board and identical pinout as esp32-s3-devkitc1-n16r8 — reuses
; include/boards/esp32s3_devkitc1 verbatim. The ONLY differences are on-module
; memory: 8MB flash (not 16MB) and 2MB QUAD-SPI PSRAM (not 8MB octal), both from
; the pioarduino platform's own esp32-s3-devkitc1-n8r2 board definition. All
; firmware functionality carries over unchanged — no application code allocates
; PSRAM in bulk (only ESP.getFreePsram() is reported).
; For the PCB use the analyze_r01_* envs below.
[env:esp32-s3-devkitc1-n8r2]
extends = oled
board = esp32-s3-devkitc1-n8r2
build_flags =
    ${common.build_flags}
    -I include/boards/esp32s3_devkitc1
    -DBOARD_HAS_PSRAM
board_build.partitions = partitions_8mb.csv


; ── Birdoscope Analyze r0.1 ───────────────────────────────────────────
; For use with the custom Birdoscope PCB boards, this is for an ESP32-S3 analyzer
; model running src/main_oled.cpp
; Board-specific pins/knobs live in include/boards/analyze_r01_esp32s3/board_config.h
; (SH1106 OLED mounted 180°, three buttons). 
;
; The PCB footprint accepts EITHER an N8R2 or an N16R8 module, so there are two
; envs — identical firmware and pinout, differing only in on-module memory
; (which comes entirely from the board def). Pick the one matching the populated
; module:
;   * analyze_r01_n8r2  — 8MB flash, 2MB quad PSRAM (cheaper, for PCB tests)
;   * analyze_r01_n16r8 — 16MB flash, 8MB octal PSRAM (for feature dev, no
;                             hardware limits)
[env:analyze_r01_n8r2]
extends = oled
board = esp32-s3-devkitc1-n8r2
build_flags =
    ${common.build_flags}
    -I include/boards/analyze_r01_esp32s3
    -DBOARD_HAS_PSRAM
board_build.partitions = partitions_8mb.csv

[env:analyze_r01_n16r8]
extends = oled
board = esp32-s3-devkitc1-n16r8
build_flags =
    ${common.build_flags}
    -I include/boards/analyze_r01_esp32s3
    -DBOARD_HAS_PSRAM
board_build.partitions = partitions_16mb.csv


; ── ESP32 Round LCD (generic GC9A01 clone) ─────────────────────────────────
; ESP32-D0WD core. No native USB-CDC, no onboard addressable LED, no PSRAM.
; 240x240 round GC9A01 SPI TFT + microSD on the same SPI bus (IO14 SCK /
; IO15 MOSI). Flash size assumed 4MB: verify with `esptool.py flash_id` before
; first flash and switch to the partition table matching the board, which
; varies between generics. Uses src/main_tft.cpp and TFT_eSPI, its own display
; family, so it extends [common] directly rather than [oled].
;
; The TFT pin defines below must match include/boards/esp32round/board_config.h;
; TFT_eSPI takes them as build flags rather than reading the board config.

[env:esp32round]
extends = common
board = esp32dev
build_src_filter = +<main_tft.cpp>
lib_deps =
    ${web.lib_deps}
    bodmer/TFT_eSPI
build_flags =
    ${common.build_flags}
    -I include/boards/esp32round
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MISO=2
    -DTFT_MOSI=15
    -DTFT_SCLK=14
    -DTFT_CS=5
    -DTFT_DC=27
    -DTFT_RST=33
    -DTFT_BL=32
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=20000000
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions_4mb.csv

; TFT_MISO is wired to IO2 even though the GC9A01 itself never uses it — this
; lets TFT_eSPI's own SPI instance come up with MISO already attached, so the
; microSD card (same bus) can share it via TFT_eSPI::getSPIinstance() without
; a second, conflicting SPI.begin() call. See main_tft.cpp setup().
