; PlatformIO project configuration. See
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = src
; Local, gitignored configs such as bench envs. A clean clone has none.
extra_configs = z_*.ini
; Board envs only, so a bare `pio run` builds the firmware. `env:native` builds
; tests and has no firmware sources, so `pio run` fails on it. Run it with
; `pio test -e native`.
default_envs =
    heltec_v4
    heltec_v3
    xiao_esp32s3
    esp32-s3-devkitc1-n16r8
    esp32-s3-devkitc1-n8r2
    analyze_r01_n8r2
    analyze_r01_n16r8
    analyze_r04_n16r8_dev
    analyze_r04_n16r8_bare
    esp32round

; ── Shared bases (via `extends`) ────────────────────────────────────────────
; Each `[env:*]` below extends one of these and declares only its deltas, the
; board, its -I and -D flags, and its memory and partition table. A new board
; extends [oled], or [common] for a different display family.
;
; Every `[env:*]` still names its own board_build.partitions. A table inherited
; from another board's flash size produces an unbootable image.

; Everything common to every board.
[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = spiffs
; check_submodules.py fails the build when vendor/jellybeans is missing.
; git_version.py stamps the git rev, commit date and build time into the binary,
; so a device in the field reports which commit it runs.
extra_scripts =
    pre:tools/check_submodules.py
    pre:tools/git_version.py
; Loads WebConsole and roost from the vendor/jellybeans submodule. See [web].
lib_extra_dirs = vendor/jellybeans
build_flags =
    -I include
    -DCORE_DEBUG_LEVEL=0
; NimBLE compiles in extended advertising and the coded PHY only with this flag.
; It belongs in [common], since every board env interpolates
; ${common.build_flags} and would drop an [oled] addition.
    -DCONFIG_BT_NIMBLE_EXT_ADV=1

; GPS, JSON and web server libraries every board uses.
;
; The jellybeans submodule under vendor/ supplies two more libraries, the
; WebConsole portal (esp_webserver) and roost, the fleet logging contract. The
; generated roost header fails the build if a board omits a capability or
; component declaration.
;
; A submodule records a commit without copying source, so this MIT-licensed tree
; does not redistribute WebConsole, a separate GPLv3 project. See NOTICE.
;
; lib_extra_dirs loads both, since a lib_deps git URL resolves to only one
; library manifest per repository. Clone with --recursive, or run
; `git submodule update --init`.
;
; lib_extra_dirs sits in [common], since [oled] pulls ${web.lib_deps} by
; interpolation and would not inherit it from this section.
[web]
lib_deps =
    mikalhart/TinyGPSPlus@^1.0.3
    bblanchon/ArduinoJson@^7.2.0
    ESP32Async/ESPAsyncWebServer@^3.11.2
    ESP32Async/AsyncTCP@^3.4.10

; u8g2 OLED family (Heltec V4/V3, XIAO, S3 DevKitC, Analyze r0.1 and r0.4),
; built from src/main_oled.cpp.
[oled]
extends = common
build_src_filter = +<main_oled.cpp>
lib_deps =
    ${web.lib_deps}
    adafruit/Adafruit NeoPixel@^1.12.3
    olikraus/U8g2@^2.35.30
    h2zero/NimBLE-Arduino@^2.5.1


; ── Host tests ──────────────────────────────────────────────────────────────
; The test/ suites, run on the build machine against the Analyze r0.1 board
; config and the generated roost header. Among other checks, they assert that a
; row's field count matches the header its manifest declares, which no
; on-device check can.
[env:native]
platform = native
test_framework = unity
lib_extra_dirs = vendor/jellybeans
extra_scripts = pre:tools/check_submodules.py
; An empty filter keeps `pio run -e native` from compiling main_oled.cpp for the
; host.
build_src_filter = -<*>
; PlatformIO compiles all of birdoscope_core, core.cpp included, once a test
; includes any of its headers, and core.cpp needs Arduino.h. lib_ignore drops
; the library and -I keeps its headers, so a test compiles only the radio-free
; modules it lists, as test/test_ble/ble_sources.cpp does.
lib_ignore = birdoscope_core
build_flags =
    -I include
    -I include/boards/analyze_r01_esp32s3
    -I lib/birdoscope_core


; ── Heltec WiFi LoRa 32 V4 ──────────────────────────────────────────────────
; ESP32-S3R2 core, 16MB flash, 2MB PSRAM, SSD1315 OLED, SMA antenna and LiPo
; charging. The platform publishes no V4 board definition, so this env uses the
; V3 one and overrides its 8MB flash size. maximum_size must move with
; flash_size, or the upload size check still caps the image at 8MB.
[env:heltec_v4]
extends = oled
board = heltec_wifi_lora_32_V3
build_flags =
    ${common.build_flags}
    -I include/boards/heltecv4
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_16mb.csv


; ── Heltec WiFi LoRa 32 V3 ──────────────────────────────────────────────────
; Same platform board def as heltec_v4, with 8MB flash and the 8MB partition
; table. The V3 has its own pinout, so it has its own board config. That config
; is a stub that blocks the build with an #error until someone verifies its
; pins. Define HELTECV3_UNVERIFIED_OK to build anyway. PSRAM presence also needs
; verification.
[env:heltec_v3]
extends = oled
board = heltec_wifi_lora_32_V3
build_flags =
    ${common.build_flags}
    -I include/boards/heltecv3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = partitions_8mb.csv


; ── Seeed XIAO ESP32-S3 ─────────────────────────────────────────────────────
; S3 core, 8MB flash, 8MB PSRAM, no onboard display, native USB-C. The board
; config is a stub that blocks the build with an #error until someone maps its
; LED, buzzer, GPS and SD pins. Define XIAO_ESP32S3_UNVERIFIED_OK to build
; anyway.
[env:xiao_esp32s3]
extends = oled
board = seeed_xiao_esp32s3
build_flags =
    ${common.build_flags}
    -I include/boards/xiao_esp32s3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions_8mb.csv


; ── ESP32-S3-DevKitC-1-N16R8 ───────────────────────────────────
; 16MB flash and 8MB PSRAM (QIO OPI), both from the board def. The breadboard
; adds SD, GPS, two buttons and an I2C OLED, and uses the module's onboard
; WS2812B. Pins live in include/boards/esp32s3_devkitc1/board_config.h, and no
; pin assignment is wiring-confirmed yet.
;
; No -DARDUINO_USB_CDC_ON_BOOT here. Serial goes through the CH343P UART bridge
; (USB1), and the flag would move it to native USB-CDC (USB2/OTG, GPIO19/20).
; See docs/hardware/hardware_s3n16r8.md.
[env:esp32-s3-devkitc1-n16r8]
extends = oled
board = esp32-s3-devkitc1-n16r8
build_flags =
    ${common.build_flags}
    -I include/boards/esp32s3_devkitc1
    -DBOARD_HAS_PSRAM
;   -DARDUINO_USB_CDC_ON_BOOT=1
board_build.partitions = partitions_16mb.csv


; ── ESP32-S3-DevKitC-1-N8R2 ───────────────────────────────────
; Same board config as esp32-s3-devkitc1-n16r8. Only on-module memory differs,
; 8MB flash and 2MB quad PSRAM, both from the platform's esp32-s3-devkitc1-n8r2
; board definition. The firmware puts BLE buffers in PSRAM when it has room and
; falls back to internal RAM, so the smaller part runs the same image. For the
; PCB, use the analyze_r01_* envs below.
[env:esp32-s3-devkitc1-n8r2]
extends = oled
board = esp32-s3-devkitc1-n8r2
build_flags =
    ${common.build_flags}
    -I include/boards/esp32s3_devkitc1
    -DBOARD_HAS_PSRAM
board_build.partitions = partitions_8mb.csv


; ── Birdoscope Analyze r0.1 ───────────────────────────────────────────
; Custom Birdoscope PCB carrying an ESP32-S3 DevKitC-1 module, an SH1106 OLED
; mounted 180° and three buttons. Pins live in
; include/boards/analyze_r01_esp32s3/board_config.h.
;
; The footprint takes an N8R2 or an N16R8 module, and the two envs differ only in
; on-module memory, which comes from the board def. Pick the one matching the
; populated module:
;   * analyze_r01_n8r2: 8MB flash, 2MB quad PSRAM, for PCB tests
;   * analyze_r01_n16r8: 16MB flash, 8MB octal PSRAM, for feature work
[env:analyze_r01_n8r2]
extends = oled
board = esp32-s3-devkitc1-n8r2
build_flags =
    ${common.build_flags}
    -I include/boards/analyze_r01_esp32s3
    -DBOARD_HAS_PSRAM
board_build.partitions = partitions_8mb.csv

[env:analyze_r01_n16r8]
extends = oled
board = esp32-s3-devkitc1-n16r8
build_flags =
    ${common.build_flags}
    -I include/boards/analyze_r01_esp32s3
    -DBOARD_HAS_PSRAM
board_build.partitions = partitions_16mb.csv


; ── Birdoscope Analyze r0.4 dev ───────────────────────────────────────────
; r0.1 with a combined SH1106 and four-button module in place of the separate
; display and three buttons. Takes an N16R8 module, and no r0.4 N8R2 env exists.
; Pins live in include/boards/analyze_r04_esp32s3/board_config.h.
;
; An r0.1 image runs on an r0.4 board but leaves one button dead and offsets the
; other two.

[env:analyze_r04_n16r8_dev]
extends = oled
board = esp32-s3-devkitc1-n16r8
build_flags =
    ${common.build_flags}
    -I include/boards/analyze_r04_esp32s3
    -DBOARD_HAS_PSRAM
board_build.partitions = partitions_16mb.csv


; ── Birdoscope Analyze r0.4 bare ───────────────────────────────────────────
; Same peripherals as the r0.4 dev board, but on a bare ESP32-S3-WROOM-1U
; soldered to the carrier instead of a DevKitC-1 module. Pins live in
; include/boards/analyze_r04_bare_esp32s3/board_config.h.
;
; The board has no USB-to-UART bridge. Its USB-C port goes straight to the SoC's
; native USB pins, so the console needs USB-CDC compiled in, and UART0 comes out
; on a 4-pin header for a bridge cable. The carrier also wires the button row in
; reverse order to the dev board, so the two images are not interchangeable.

[env:analyze_r04_n16r8_bare]
extends = oled
board = esp32-s3-devkitc1-n16r8
build_flags =
    ${common.build_flags}
    -I include/boards/analyze_r04_bare_esp32s3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
board_build.partitions = partitions_16mb.csv


; ── ESP32 Round LCD (generic GC9A01 clone) ─────────────────────────────────
; ESP32-D0WD core with no native USB-CDC, onboard addressable LED or PSRAM. A
; 240x240 round GC9A01 SPI TFT and the microSD share one SPI bus (IO14 SCK,
; IO15 MOSI). The 4MB flash size is an assumption. Verify it with
; `esptool.py flash_id` before first flash and switch to the partition table
; matching the board, since generics vary. The env builds src/main_tft.cpp with
; TFT_eSPI, a separate display family, so it extends [common] directly.
;
; TFT_eSPI takes its pins only from the build flags below, and the board config
; does not define them.

[env:esp32round]
extends = common
board = esp32dev
build_src_filter = +<main_tft.cpp>
lib_deps =
    ${web.lib_deps}
    bodmer/TFT_eSPI
build_flags =
    ${common.build_flags}
    -I include/boards/esp32round
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MISO=2
    -DTFT_MOSI=15
    -DTFT_SCLK=14
    -DTFT_CS=5
    -DTFT_DC=27
    -DTFT_RST=33
    -DTFT_BL=32
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=20000000
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions_4mb.csv

; The GC9A01 never uses TFT_MISO. Setting it to IO2 brings TFT_eSPI's own SPI
; instance up with MISO attached, so the microSD card shares the bus through
; TFT_eSPI::getSPIinstance() without a second SPI.begin(). See main_tft.cpp
; setup().
