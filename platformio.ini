; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = src

; ── Shared bases (via `extends`) ────────────────────────────────────────────
; Concrete [env:*] sections below extend one of these and declare only their
; deltas (board, board-specific -I/-D flags, memory/partition table). Add new
; boards by extending [oled] [tft] (or [common] for a different display family) —
; don't re-paste the platform/lib_deps/lib_extra_dirs blocks.

; Everything common to every board.
[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = spiffs
build_flags =
    -I include
    -DCORE_DEBUG_LEVEL=0

; Radio/GPS/JSON stack used by every board (WebConsole portal + serial JSON).
;
; WebConsole is pulled from its own repository rather than vendored — it stays a
; separate GPLv3 project, while birdoscope's source is MIT (see NOTICE). The
; library lives in the repo's esp_webserver/ subdirectory; PlatformIO finds the
; manifest there on its own, so the bare repo URL is correct.
[web]
lib_deps =
    https://github.com/LoneCrowDesign/jellybeans.git
    mikalhart/TinyGPSPlus@^1.0.3
    bblanchon/ArduinoJson@^7.2.0
    ESP32Async/ESPAsyncWebServer@^3.11.2
    ESP32Async/AsyncTCP@^3.4.10

; u8g2 status-line OLED family (Heltec V4/V3, XIAO, S3 DevKitC, PCB r0.1).
; Shares src/main_oled.cpp; adds the NeoPixel + U8g2 libs on top of [web].
[oled]
extends = common
build_src_filter = +<main_oled.cpp>
lib_deps =
    ${web.lib_deps}
    adafruit/Adafruit NeoPixel@^1.12.3
    olikraus/U8g2@^2.35.30


; ── Heltec WiFi LoRa 32 V4 ──────────────────────────────────────────────────
; V4: ESP32-S3 core, 16MB flash, no PSRAM, SSD1306 OLED, SMA antenna, LiPo charging.
; NOTE: PlatformIO board definition is heltec_wifi_lora_32_V3 even for V4 hardware.
[env:heltec_v4]
extends = oled
board = heltec_wifi_lora_32_V3
build_flags =
    ${common.build_flags}
    -I include/boards/heltecv4
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv


; ── Heltec WiFi LoRa 32 V3 ──────────────────────────────────────────────────
; V3: ESP32-S3 core, 8MB flash, PSRAM, SSD1306 OLED, SMA antenna, LiPo charging.
; STUB — pinout and partition size need verification before use.
[env:heltec_v3]
extends = oled
board = heltec_wifi_lora_32_V3
build_flags =
    ${common.build_flags}
    -I include/boards/heltecv3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv


; ── Seeed XIAO ESP32-S3 ─────────────────────────────────────────────────────
; S3 core, 8MB flash, 8MB PSRAM, no onboard display, USB-C native.
; STUB — pinout for LED/buzzer/GPS/SD differs from DevKitC-1; needs mapping.
[env:xiao_esp32s3]
extends = oled
board = seeed_xiao_esp32s3
build_flags =
    ${common.build_flags}
    -I include/boards/xiao_esp32s3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv


; ── ESP32-S3-DevKitC-1-N16R8 ───────────────────────────────────
; 16MB flash, 8MB PSRAM (QIO OPI) — both come from the board
; def. No onboard display/GPS/SD/LED — SD, external NeoPixel, GPS, two buttons,
; and an I2C OLED are all wired up on the breadboard. Uses src/main_oled.cpp —
; see include/boards/esp32s3n16r8/board_config.h for this board's pins. None of
; the pin assignments are wiring-confirmed yet.
;
; No -DARDUINO_USB_CDC_ON_BOOT here — per docs/hardware/hardware_s3n16r8.md,
; Serial goes through the CH343P hardware UART bridge (USB1), not native
; USB-CDC (USB2/OTG, GPIO19/20). Setting the flag would init the wrong port.
[env:esp32-s3-devkitc1-n16r8]
extends = oled
board = esp32-s3-devkitc1-n16r8
build_flags =
    ${common.build_flags}
    -I include/boards/esp32s3n16r8
    -DBOARD_HAS_PSRAM
board_build.partitions = partitions.csv


; ── ESP32-S3-DevKitC-1-N8R2 ───────────────────────────────────
; Same DevKitC-1 board and identical pinout as esp32-s3-devkitc1-n16r8 — reuses
; include/boards/esp32s3n16r8 verbatim. The ONLY differences are on-module
; memory: 8MB flash (not 16MB) and 2MB QUAD-SPI PSRAM (not 8MB octal), both from
; the pioarduino platform's own esp32-s3-devkitc1-n8r2 board definition. All
; firmware functionality carries over unchanged — no application code allocates
; PSRAM in bulk (only ESP.getFreePsram() is reported).
; For the PCB use the pcb_r01_analyze_* envs below.
[env:esp32-s3-devkitc1-n8r2]
extends = oled
board = esp32-s3-devkitc1-n8r2
build_flags =
    ${common.build_flags}
    -I include/boards/esp32s3n16r8
    -DBOARD_HAS_PSRAM
board_build.partitions = partitions_8mb.csv


; ── Birdoscope PCB r0.1 "analyze" ───────────────────────────────────────────
; For use with the custom Birdoscope PCB boards, this is for an ESP32-S3 analyzer
; model running src/main_oled.cpp
; Board-specific pins/knobs live in include/boards/pcb_r01_analyze/board_config.h
; (SH1106 OLED mounted 180°, three buttons). 
;
; The PCB footprint accepts EITHER an N8R2 or an N16R8 module, so there are two
; envs — identical firmware and pinout, differing only in on-module memory
; (which comes entirely from the board def). Pick the one matching the populated
; module:
;   * pcb_r01_analyze_n8r2  — 8MB flash, 2MB quad PSRAM (cheaper, for PCB tests)
;   * pcb_r01_analyze_n16r8 — 16MB flash, 8MB octal PSRAM (for feature dev, no
;                             hardware limits)
[env:pcb_r01_analyze_n8r2]
extends = oled
board = esp32-s3-devkitc1-n8r2
build_flags =
    ${common.build_flags}
    -I include/boards/pcb_r01_analyze
    -DBOARD_HAS_PSRAM
board_build.partitions = partitions_8mb.csv

[env:pcb_r01_analyze_n16r8]
extends = oled
board = esp32-s3-devkitc1-n16r8
build_flags =
    ${common.build_flags}
    -I include/boards/pcb_r01_analyze
    -DBOARD_HAS_PSRAM
board_build.partitions = partitions.csv


; ── ESP32-S3 Round LCD (generic GC9A01 clone) ───────────────────────────────
; ESP32-D0WD core. No native USB-CDC, no onboard addressable LED, no PSRAM. 240x240 round
; GC9A01 SPI TFT + microSD on the same SPI bus (IO14 SCK / IO15 MOSI). Flash
; size assumed 4MB — verify with `esptool.py flash_id` before first flash and
; rescale partitions_esp32round.csv to fit your actual board (there are variations between
; geneerics). Uses src/main_tft.cpp (its own display family due to different UX design)
; and TFT_eSPI, so it extends [common] directly, not [oled].
;
; TFT_eSPI pin config below confirmed against a known-working build for this
; exact board — same TFT pins, same BTN_SCAN=4/BTN_NEXT=19.

[env:esp32round]
extends = common
board = esp32dev
build_src_filter = +<main_tft.cpp>
lib_deps =
    ${web.lib_deps}
    bodmer/TFT_eSPI
build_flags =
    ${common.build_flags}
    -I include/boards/esp32round
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MISO=2
    -DTFT_MOSI=15
    -DTFT_SCLK=14
    -DTFT_CS=5
    -DTFT_DC=27
    -DTFT_RST=33
    -DTFT_BL=32
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=20000000
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions_esp32round.csv

; TFT_MISO is wired to IO2 even though the GC9A01 itself never uses it — this
; lets TFT_eSPI's own SPI instance come up with MISO already attached, so the
; microSD card (same bus) can share it via TFT_eSPI::getSPIinstance() without
; a second, conflicting SPI.begin() call. See main_tft.cpp setup().
